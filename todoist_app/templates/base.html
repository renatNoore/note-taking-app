<!doctype html>
<html lang="en" hx-boost="true">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Tasks{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">Todoist-like</a>
    <form class="d-flex ms-auto" method="get" action="{{ url_for('index') }}">
      <input class="form-control form-control-sm me-2" type="search" placeholder="Search" name="q" value="{{ q or '' }}">
      <button class="btn btn-sm btn-outline-light" type="submit">Search</button>
    </form>
  </div>
</nav>
<div class="container-fluid py-3">
  {% block content %}{% endblock %}
</div>
</body>
</html>
